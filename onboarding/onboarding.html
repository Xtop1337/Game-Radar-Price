<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ob.pageTitle">Welcome — Game Radar</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/page.css">
  <script src="../styles/theme-boot.js"></script>
</head>
<body>
  <div class="page">
    <div class="hero">
      <img src="../icons/icon.svg" alt="">
      <h1 data-i18n="app.name">Game Radar</h1>
      <p data-i18n="ob.intro"></p>
      <div id="action">
        <button class="btn primary big" id="grantBtn" data-i18n="ob.grant">Allow access to the stores</button>
        <p class="hint" data-i18n="ob.grantHint"></p>
      </div>
      <p class="done" id="done" hidden data-i18n="ob.done"></p>
    </div>
    <div class="features">
      <div class="feature"><div class="emoji">🎁</div><b data-i18n="ob.f1Title"></b><span data-i18n="ob.f1"></span></div>
      <div class="feature"><div class="emoji">🔥</div><b data-i18n="ob.f2Title"></b><span data-i18n="ob.f2"></span></div>
      <div class="feature"><div class="emoji">💜</div><b data-i18n="ob.f3Title"></b><span data-i18n="ob.f3"></span></div>
    </div>
    <p class="foot"><a href="../options/options.html" data-i18n="ob.openSettings">Open settings</a></p>
  </div>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
